name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run embed
      - run: git diff --exit-code -- site.mjs admin.mjs
      - run: node --check worker.mjs
      - run: node --check catalog.mjs

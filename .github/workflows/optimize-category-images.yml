name: Optimize category image thumbnails
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-category-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  thumbnails:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet pillow
      - name: Build compact PNG category thumbnails
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Path('assets/category-icons')
          out=src/'thumbs'
          out.mkdir(exist_ok=True)
          names=['liquids','pod-systems','consumables','energy-drinks','snus','hookahs','tobacco-products','disposable-devices','beer']
          for name in names:
              im=Image.open(src/(name+'.png')).convert('RGBA')
              im.thumbnail((160,160),Image.Resampling.LANCZOS)
              dst=out/(name+'.png')
              im.save(dst,format='PNG',optimize=True)
              with Image.open(dst) as check:check.verify()
              print(name, dst.stat().st_size)
          PY
      - name: Commit optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/category-icons/thumbs/*.png
          if ! git diff --cached --quiet; then git commit -m "Generate optimized category thumbnails"; git push; fi

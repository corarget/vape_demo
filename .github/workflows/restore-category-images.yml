name: Restore valid category PNG assets
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-category-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and validate original user-supplied images
        run: |
          python3 - <<'PY'
          import urllib.request, pathlib, struct
          files={"liquids.png":"1HKig0_kBOku9qpVUCJGodMZ2bfH5V1tl","pod-systems.png":"1rliM-2PNljizLDR2JvbaqvKUPY2E_pZe","consumables.png":"1NwqViOgOlw6Lm8Cr6LMXzz0bMz1DJOJB","energy-drinks.png":"12QRB-YytoHc25AbTg_aNTZLyx3mGwPd2","snus.png":"1wTKjFabvbe3cOw7qpiRZNl-1zU3ioCVF","hookahs.png":"11f1VOuGMz3muzQgux6whja62GI5yAzU7","tobacco-products.png":"1yvuX-Dx_nKD8JMOOfc2XLFti5uE_U09t","disposable-devices.png":"1UXLAoikgihjGqIndMaq9fR0DgFdLkSaK","beer.png":"1M-yJLEAR0cARYvU-MVg0Pm1BTHXhqX5O"}
          output=pathlib.Path("assets/category-icons")
          output.mkdir(parents=True,exist_ok=True)
          for name,drive_id in files.items():
              url="https://drive.usercontent.google.com/download?id="+drive_id+"&export=download"
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=45) as response:
                  data=response.read()
              if not data.startswith(b"\x89PNG\r\n\x1a\n") or b"IEND" not in data[-32:]:
                  raise RuntimeError(f"Invalid PNG for {name} (size {len(data)})")
              width,height=struct.unpack(">II",data[16:24])
              if min(width,height)<128:
                  raise RuntimeError(f"Unexpected dimensions {width}x{height}: {name}")
              (output/name).write_bytes(data)
              print(f"Restored {name}: {len(data)} bytes {width}x{height}")
          PY
      - name: Commit restored binary images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/category-icons/*.png
          if git diff --cached --quiet; then echo "Images already correct"; else
            git commit -m "Restore 9 valid category PNG originals"
            git push
          fi
